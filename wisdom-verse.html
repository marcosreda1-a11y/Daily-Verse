<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0F4C81; --chip:#F7C948; --ink:#14143a; --paper:#fffdf5; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body { background: var(--bg); color: #fff; font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
         transition: background .5s ease; display: flex; flex-direction: column; align-items: center;
         padding: 22px 18px 40px; overflow-x: hidden; position: relative; }
  body::before { content: ""; position: fixed; width: 70vmax; height: 70vmax; border-radius: 50%;
         background: var(--chip); opacity: .2; bottom: -30vmax; right: -24vmax; transition: background .5s ease; }
  header, main { position: relative; width: 100%; max-width: 560px; }
  header { font-weight: 900; font-size: 26px; padding: 6px 4px 18px; }
  main { margin: auto 0; }
  .card { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 26px;
          box-shadow: 8px 8px 0 var(--ink); padding: 54px 26px 28px; position: relative; transform: rotate(1deg); }
  .card::before { content: "”"; position: absolute; top: -6px; right: 22px; font-size: 120px; line-height: 1;
          font-weight: 900; color: var(--chip); -webkit-text-stroke: 3px var(--ink); }
  #verse { font-size: clamp(25px, 6.4vw, 36px); line-height: 1.75; font-weight: 800; margin: 0 0 22px;
           min-height: 5em; transition: opacity .25s ease, transform .25s ease; }
  #verse.fade { opacity: 0; transform: translateY(8px); }
  .ref { display: inline-block; background: var(--chip); color: var(--ink); border: 3px solid var(--ink);
         border-radius: 999px; padding: 2px 18px; font-weight: 900; font-size: 19px; transition: background .5s ease; }
  .actions { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 900; font-size: 19px; color: var(--ink); background: var(--chip);
           border: 3px solid var(--ink); border-radius: 16px; padding: 10px 20px; cursor: pointer;
           box-shadow: 4px 4px 0 var(--ink); transition: transform .12s, box-shadow .12s, background .5s; }
  button:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button:disabled { opacity: .7; cursor: wait; }
  #next { flex: 1 1 100%; font-size: 23px; padding: 14px 20px; background: var(--ink); color: #fff; }
  .ghost { flex: 1; background: var(--paper); }
  #toast { position: fixed; bottom: 22px; background: var(--ink); color: #fff; padding: 8px 20px;
           border-radius: 999px; font-weight: 800; opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  .top { position: relative; width: 100%; max-width: 560px; text-align: center; padding: 4px 0 26px; }
  .logos { display: flex; justify-content: center; gap: 18px; margin-bottom: 14px; }
  .logos img { width: 92px; height: 92px; object-fit: contain; }
  .top h1 { margin: 0; font-size: clamp(32px, 9vw, 46px); font-weight: 900; line-height: 1.3; }
</style>
</head>

  <h1>الشباب والحرية</h1>
</div>
<main>
  <section class="card">
    <p id="verse" aria-live="polite">لحظة…</p>
    <span class="ref" id="ref">…</span>
    <div class="actions">
      <button id="copy" class="ghost" type="button">نسخ</button>
      <button id="share" class="ghost" type="button">مشاركة</button>
    </div>
  </section>
</main>
<div id="toast" role="status"></div>
<script>
const API = "https://api.getbible.net/v2/arabicsv/";

// أرقام الأسفار في getBible: 5 تثنية، 6 يشوع، 18 أيوب، 19 مزامير، 20 أمثال، 21 جامعة،
// 23 إشعياء، 24 إرميا، 25 مراثي، 40 متى، 43 يوحنا، 45 رومية، 47 2كورنثوس، 50 فيلبي، 60 1بطرس، 66 رؤيا

// أجزاء من الأسفار نسحب منها آية عشوائية: [سفر، عدد الإصحاحات]
const WISDOM = [[20,31],[21,12],[18,42],[19,150],[23,66],[24,52],[25,5]];

// آيات تعزية معروفة [سفر، إصحاح، آية]. النص نفسه بيتسحب من الـ API
const COMFORT = [
  [23,41,10],[23,40,31],[23,43,1],[23,26,3],[23,54,10],[23,66,13],[23,12,2],
  [24,29,11],[24,31,3],[24,17,7],[25,3,22],[25,3,23],
  [19,23,1],[19,23,4],[19,34,18],[19,46,1],[19,27,1],[19,91,1],[19,55,22],[19,94,19],[19,30,5],[19,147,3],[19,119,105],
  [20,3,5],[20,3,6],[20,18,10],[20,17,22],[20,12,25],[20,4,23],
  [21,3,1],[21,3,11],[21,4,9],[18,19,25],
  [5,31,6],[6,1,9],
  [40,11,28],[40,6,34],[43,14,27],[43,16,33],[45,8,28],[47,1,3],[47,12,9],[50,4,6],[50,4,7],[50,4,13],[60,5,7],[66,21,4]
];

const THEMES = [
  { bg: "#0F4C81", chip: "#F7C948" }, { bg: "#7B2D5B", chip: "#9BE7C4" },
  { bg: "#1B6B4A", chip: "#FFD1A1" }, { bg: "#B23A48", chip: "#BDE0FE" },
  { bg: "#3D348B", chip: "#F9DC5C" }
];
let themeIdx = 0, current = "";

const rnd = n => Math.floor(Math.random() * n);

function pickTarget() {
  // 60% آية تعزية معروفة، 40% آية عشوائية من أسفار الحكمة والأنبياء
  if (Math.random() < 0.6) {
    const [book, chapter, verse] = COMFORT[rnd(COMFORT.length)];
    return { book, chapter, verse };
  }
  const total = WISDOM.reduce((a, w) => a + w[1], 0);
  let r = rnd(total);
  for (const [book, n] of WISDOM) {
    if (r < n) return { book, chapter: r + 1, verse: null };
    r -= n;
  }
}
function nextTheme() {
  themeIdx = (themeIdx + 1 + rnd(THEMES.length - 1)) % THEMES.length;
  const t = THEMES[themeIdx], s = document.documentElement.style;
  s.setProperty("--bg", t.bg); s.setProperty("--chip", t.chip);
}
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1600);
}
async function fetchVerse() {
  for (let attempt = 0; attempt < 3; attempt++) {
    const t = pickTarget();
    const res = await fetch(API + t.book + "/" + t.chapter + ".json");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const all = Object.values(data.verses || {}).filter(v => v.text && v.text.trim());
    let v = t.verse ? all.find(x => Number(x.verse) === t.verse) : null;
    if (!v) {
      const list = all.filter(x => x.text.trim().length > 20);
      if (!list.length) continue;
      v = list[rnd(list.length)];
    }
    return { text: v.text.trim(), ref: data.book_name + " " + data.chapter + ":" + v.verse };
  }
  throw new Error("no verse");
}
async function loadVerse() {
  const verseEl = document.getElementById("verse"), refEl = document.getElementById("ref");
  verseEl.classList.add("fade");
  try {
    const v = await fetchVerse();
    await new Promise(r => setTimeout(r, 220));
    nextTheme();
    verseEl.textContent = v.text; refEl.textContent = v.ref;
    current = v.text + "\n— " + v.ref;
  } catch (e) {
    verseEl.textContent = "مقدرناش نحمّل الآية. اتأكد من النت وجرّب تاني.";
    refEl.textContent = "خطأ في الاتصال"; current = "";
  } finally {
    verseEl.classList.remove("fade");
  }
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("تم النسخ ✓"); } catch (e) { toast("تعذّر النسخ"); }
}
document.getElementById("copy").addEventListener("click", () => current && copyText(current));
document.getElementById("share").addEventListener("click", async () => {
  if (!current) return;
  const text = current + "\n" + location.href;
  if (navigator.share) { try { await navigator.share({ text }); } catch (e) {} } else { copyText(text); }
});
loadVerse();
</script>
